name: 值班表企业微信推送
on:
  schedule:
    # 每天北京时间 09:00
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取今日值班人并推送
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          CONTENT=$(
            "## 今日值班提醒\n\n> 日期：\(20261105) \($w)\n> 值班人：\(张山)")

          curl -s -X POST "$WECHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "content": '"$CONTENT"'
              }
            }'